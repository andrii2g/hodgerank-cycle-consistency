name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Restore locked dependencies
        run: dotnet restore HodgeRank.slnx --locked-mode
      - name: Build
        run: dotnet build HodgeRank.slnx -c Release --no-restore
      - name: Test
        run: dotnet test HodgeRank.slnx -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Install verification dependency
        run: python -m pip install -r tools/requirements.txt
      - name: Compare with NumPy
        run: python -B tools/verify_numpy.py
      - name: Generate demonstration reports
        run: dotnet src/HodgeRank.Cli/bin/Release/net11.0/HodgeRank.Cli.dll demo
      - name: Save test results and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports-${{ matrix.os }}
          path: |
            TestResults/
            artifacts/demo/
          retention-days: 7
